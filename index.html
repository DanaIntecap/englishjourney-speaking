<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>English Journey Speaking Practice</title>

<style>

body{
font-family:Arial,sans-serif;
background:#58cc02;
padding:20px;
}

.container{
max-width:700px;
margin:auto;
background:white;
padding:20px;
border-radius:20px;
}

button,
select{
width:100%;
padding:15px;
margin-top:10px;
font-size:16px;
border:none;
border-radius:10px;
box-sizing:border-box;
}

button{
cursor:pointer;
}

.blue{
background:#1cb0f6;
color:white;
}

.green{
background:#58cc02;
color:white;
}

.red{
background:#ff4b4b;
color:white;
}

#question,
#questionTranslation,
#answer,
#answerTranslation,
#reminder{
display:none;
margin-top:15px;
padding:15px;
background:#f2f2f2;
border-radius:10px;
}

#speechResult,
#expectedAnswer,
#wordCount{
margin-top:15px;
padding:15px;
background:#f2f2f2;
border-radius:10px;
}

#speechResult{
min-height:80px;
}

</style>

</head>

<body>

<div class="container">

<h2>Speaking Practice</h2>

<select id="unit"></select>

<button class="blue" onclick="playQuestion()">
🔊 Listen Question
</button>

<button class="green" onclick="showQuestion()">
👀 Show Question
</button>

<button class="green" onclick="showQuestionTranslation()">
🌎 Question Translation
</button>

<button class="green" onclick="showAnswer()">
✅ Show Answer
</button>

<button class="green" onclick="showAnswerTranslation()">
🌎 Answer Translation
</button>

<button class="blue" onclick="playAnswer()">
🔊 Listen Answer
</button>

<button class="red" onclick="nextQuestion()">
➡ Next Question
</button>

<div id="question"></div>

<div id="questionTranslation"></div>

<div id="answer"></div>

<div id="answerTranslation"></div>

<div id="reminder"></div>

<hr>

<h3>🎤 Speaking Practice</h3>

<button class="blue" onclick="startRecognition()">
🎤 Start Recording
</button>

<button class="red" onclick="stopRecognition()">
⏹ Stop Recording
</button>

<button id="openStandaloneBtn" style="display:none;">
🚀 Open Full Screen Practice
</button>

<div id="speechResult">
Your speech will appear here...
</div>

<div id="expectedAnswer"></div>

<div id="wordCount"></div>

</div>

<script>

let data = [];
let questions = [];
let current = null;
let recognition = null;

fetch("questions.json")
.then(response => response.json())
.then(result => {

data = result;

const units =
[...new Set(
data
.map(x => String(x.unit || "").trim())
.filter(x => x !== "")
)];

const combo =
document.getElementById("unit");

combo.innerHTML =
'<option value="ALL">All Units</option>';

units.forEach(unit => {

combo.innerHTML +=
`<option value="${unit}">
${unit}
</option>`;

});

combo.addEventListener(
"change",
filterQuestions
);

filterQuestions();

})
.catch(error => {

document.getElementById("question").style.display="block";

document.getElementById("question").innerHTML =
"Error loading questions.json";

console.error(error);

});

function filterQuestions(){

const selected =
document.getElementById("unit").value;

if(selected === "ALL"){

questions = [...data];

}else{

questions =
data.filter(
x => String(x.unit || "").trim() === selected
);

}

shuffle(questions);

nextQuestion();

}

function shuffle(array){

for(let i=array.length-1;i>0;i--){

const j =
Math.floor(Math.random()*(i+1));

[array[i],array[j]] =
[array[j],array[i]];

}

}

function nextQuestion(){

if(questions.length===0){

filterQuestions();
return;

}

current = questions.pop();

document.getElementById("question").style.display="none";
document.getElementById("questionTranslation").style.display="none";
document.getElementById("answer").style.display="none";
document.getElementById("answerTranslation").style.display="none";
document.getElementById("reminder").style.display="none";

document.getElementById("speechResult").innerHTML =
"Your speech will appear here...";

document.getElementById("expectedAnswer").innerHTML = "";

document.getElementById("wordCount").innerHTML = "";

}

function getVoice(){

const voices =
speechSynthesis.getVoices();

let voice =
voices.find(v =>
v.lang.includes("en-US")
);

if(!voice){

voice =
voices.find(v =>
v.lang.startsWith("en")
);

}

return voice;

}

function speak(text){

if(!text) return;

speechSynthesis.cancel();

const msg =
new SpeechSynthesisUtterance(text);

msg.lang = "en-US";

const voice = getVoice();

if(voice){

msg.voice = voice;

}

speechSynthesis.speak(msg);

}

function playQuestion(){

if(current){

speak(current.question);

}

}

function playAnswer(){

if(current){

speak(current.answer);

}

}

function showQuestion(){

const div =
document.getElementById("question");

div.style.display="block";

div.innerHTML =
"<b>Question</b><br><br>" +
(current.question || "");

}

function showQuestionTranslation(){

const div =
document.getElementById(
"questionTranslation"
);

div.style.display="block";

div.innerHTML =
"<b>Translation</b><br><br>" +
(current.questionTranslation || "");

}

function showAnswer(){

const answer =
document.getElementById("answer");

const reminder =
document.getElementById("reminder");

answer.style.display="block";
reminder.style.display="block";

answer.innerHTML =
"<b>Answer</b><br><br>" +
(current.answer || "");

reminder.innerHTML =
"<b>Reminder</b><br><br>" +
(current.reminder || "");

}

function showAnswerTranslation(){

const div =
document.getElementById(
"answerTranslation"
);

div.style.display="block";

div.innerHTML =
"<b>Translation</b><br><br>" +
(current.answerTranslation || "");

}

function startRecognition(){

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!SpeechRecognition){

alert("Speech Recognition is not supported in this browser.");
return;

}

recognition =
new SpeechRecognition();

recognition.lang = "en-US";
recognition.interimResults = true;
recognition.continuous = true;

recognition.onresult = function(event){

let transcript = "";

for(let i=0;i<event.results.length;i++){

transcript +=
event.results[i][0].transcript + " ";

}

document.getElementById("speechResult").innerHTML =
"<b>You Said:</b><br><br>" +
transcript;

document.getElementById("expectedAnswer").innerHTML =
"<b>Expected Answer:</b><br><br>" +
(current?.answer || "");

const words =
transcript.trim()
.split(/\s+/)
.filter(Boolean)
.length;

document.getElementById("wordCount").innerHTML =
"<b>Words Spoken:</b><br><br>" +
words;

};

recognition.start();

}

function stopRecognition(){

if(recognition){

recognition.stop();

}

}

</script>

</body>
</html>
